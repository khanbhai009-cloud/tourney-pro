name: Build 2 APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      matrix:
        variant:
          - { name: "admin", config: "cap.admin.json", output: "BattlePro-Admin.apk" }
          - { name: "user",  config: "cap.user.json",  output: "BattlePro-User.apk"  }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # npm cache hata diya hai taaki package-lock.json ka error na aaye

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          # gradle cache hata diya hai taaki missing gradle file ka error na aaye

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Web Directory & Config (Magic Finder)
        run: |
          # 1. Purani config hata do aur sahi wali copy karo
          rm -f capacitor.config.ts capacitor.config.js
          cp ${{ matrix.variant.config }} capacitor.config.json
          
          echo "=== 🔍 Dekhte hain HTML files kahan chhipi hain ==="
          find . -name "*.html" -not -path '*/\.*'
          
          # 2. Capacitor ke liye perfect folders banao
          mkdir -p www/admin www/user
          
          # 3. Admin ke liye admin.html ko dhoondh kar index.html banao taaki white screen na aaye
          if [ "${{ matrix.variant.name }}" == "admin" ]; then
            ADMIN_PATH=$(find . -iname "admin.html" | head -n 1)
            
            if [ -n "$ADMIN_PATH" ]; then
              echo "✅ Admin file mil gayi yahan: $ADMIN_PATH"
              cp "$ADMIN_PATH" www/admin/index.html
            else
              echo "❌ ERROR: admin.html pure repo me kahin nahi mili! Upar list check karo."
              exit 1
            fi
          fi
          
          # 4. User ke liye index.html dhoondho
          if [ "${{ matrix.variant.name }}" == "user" ]; then
            USER_PATH=$(find . -iname "index.html" | grep -i "user" | head -n 1)
            
            if [ -n "$USER_PATH" ]; then
              echo "✅ User file mil gayi yahan: $USER_PATH"
              cp "$USER_PATH" www/user/index.html
            else
              echo "❌ ERROR: User ki index.html pure repo me kahin nahi mili! Upar list check karo."
              exit 1
            fi
          fi
          
          echo "=== Capacitor ke liye Final Ready Folder ==="
          ls -la www/${{ matrix.variant.name }}

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate App Icon
        run: |
          npm install @capacitor/assets --no-save
          mkdir -p resources
          
          if [ -f "assets/${{ matrix.variant.name }}.png" ]; then
            cp "assets/${{ matrix.variant.name }}.png" resources/icon-only.png
            cp "assets/${{ matrix.variant.name }}.png" resources/icon-foreground.png
            cp "assets/${{ matrix.variant.name }}.png" resources/icon.png
          elif [ -f "assets/${{ matrix.variant.name }}.jpg" ]; then
            cp "assets/${{ matrix.variant.name }}.jpg" resources/icon-only.png
            cp "assets/${{ matrix.variant.name }}.jpg" resources/icon-foreground.png
            cp "assets/${{ matrix.variant.name }}.jpg" resources/icon.png
          fi
          
          if [ -d "resources" ]; then
            npx @capacitor/assets generate --android --assetPath resources
          else
            echo "⚠️ Warning: Icon file nahi mili, default icon hi rahega."
          fi

      - name: Fix gradlew
        run: |
          python3 -c "
          content = open('android/gradlew', 'rb').read()
          fixed = content.replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          open('android/gradlew', 'wb').write(fixed)
          print('Done. CRLF fixed.')
          "
          chmod +x android/gradlew

      - name: Set Gradle Properties
        run: |
          cat > android/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Generate Google Services JSON
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES" > android/app/google-services.json

      - name: Build ${{ matrix.variant.name }} APK
        timeout-minutes: 25
        working-directory: android
        run: |
          bash gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace

          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK generated at: $APK"
          cp "$APK" ../${{ matrix.variant.output }}

      - name: Upload ${{ matrix.variant.name }} APK
        uses: actions/upload-artifact@v4
        with:
          name: BattlePro-${{ matrix.variant.name }}-APK
          path: ${{ matrix.variant.output }}
          retention-days: 7
