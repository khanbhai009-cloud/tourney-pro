name: Build 2 APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      matrix:
        variant:
          - { name: "admin", config: "cap.admin.json", output: "BattlePro-Admin.apk" }
          - { name: "user",  config: "cap.user.json",  output: "BattlePro-User.apk"  }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Web Directory & Config (Auto-Fix)
        run: |
          # 1. Purani TS/JS config hata do taaki conflict na ho (agar hui toh)
          rm -f capacitor.config.ts capacitor.config.js
          
          # 2. Sahi variant ki config copy karo
          cp ${{ matrix.variant.config }} capacitor.config.json
          echo "=== Config file ready ==="
          
          # 3. Folder banayein
          mkdir -p www/${{ matrix.variant.name }}
          
          # 4. Agar capital letter ka issue hai (e.g. Index.html), usko theek karein
          if [ -f "www/${{ matrix.variant.name }}/Index.html" ]; then
            mv "www/${{ matrix.variant.name }}/Index.html" "www/${{ matrix.variant.name }}/index.html"
          fi
          
          # 5. Failsafe: Agar index.html abhi bhi nahi mili, toh error roko
          if [ ! -f "www/${{ matrix.variant.name }}/index.html" ]; then
            echo "🚨 index.html nahi mili GitHub actions mein! Ek dummy file bana rahe hain taaki build crash na ho..."
            echo "<html><body>Error: index.html was missing in repo.</body></html>" > www/${{ matrix.variant.name }}/index.html
          fi
          
          echo "=== Folder contents ==="
          ls -la www/${{ matrix.variant.name }}

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate App Icon
        run: |
          npm install @capacitor/assets --no-save
          mkdir -p resources
          
          if [ -f "assets/${{ matrix.variant.name }}.png" ]; then
            cp "assets/${{ matrix.variant.name }}.png" resources/icon-only.png
            cp "assets/${{ matrix.variant.name }}.png" resources/icon-foreground.png
            cp "assets/${{ matrix.variant.name }}.png" resources/icon.png
          elif [ -f "assets/${{ matrix.variant.name }}.jpg" ]; then
            cp "assets/${{ matrix.variant.name }}.jpg" resources/icon-only.png
            cp "assets/${{ matrix.variant.name }}.jpg" resources/icon-foreground.png
            cp "assets/${{ matrix.variant.name }}.jpg" resources/icon.png
          fi
          
          if [ -d "resources" ]; then
            npx @capacitor/assets generate --android --assetPath resources
          else
            echo "⚠️ Warning: Icon file nahi mili, default icon hi rahega."
          fi

      - name: Fix gradlew
        run: |
          python3 -c "
          content = open('android/gradlew', 'rb').read()
          fixed = content.replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          open('android/gradlew', 'wb').write(fixed)
          print('Done. CRLF fixed.')
          "
          chmod +x android/gradlew

      - name: Set Gradle Properties
        run: |
          cat > android/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Generate Google Services JSON
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES" > android/app/google-services.json

      - name: Build ${{ matrix.variant.name }} APK
        timeout-minutes: 25
        working-directory: android
        run: |
          bash gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace

          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK generated at: $APK"
          cp "$APK" ../${{ matrix.variant.output }}

      - name: Upload ${{ matrix.variant.name }} APK
        uses: actions/upload-artifact@v4
        with:
          name: BattlePro-${{ matrix.variant.name }}-APK
          path: ${{ matrix.variant.output }}
          retention-days: 7
