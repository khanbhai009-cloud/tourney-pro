name: Build 2 APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      matrix:
        variant:
          - { name: "admin", config: "cap.admin.json", output: "BattlePro-Admin.apk" }
          - { name: "user",  config: "cap.user.json",  output: "BattlePro-User.apk"  }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Web Directory & Config (Strict Rename)
        run: |
          rm -f capacitor.config.ts capacitor.config.js
          cp ${{ matrix.variant.config }} capacitor.config.json
          
          if [ "${{ matrix.variant.name }}" == "admin" ]; then
            cd www/admin || exit 1
            find . -maxdepth 1 -iname "*admin.html*" | while read -r file; do
              mv "$file" index.html
            done
            cd ../..
          fi
          
          if [ "${{ matrix.variant.name }}" == "user" ]; then
            cd www/user || exit 1
            find . -maxdepth 1 -iname "*index.html*" | while read -r file; do
              if [ "$(basename "$file")" != "index.html" ]; then
                mv "$file" index.html
              fi
            done
            cd ../..
          fi
          
          echo "=== Capacitor ke liye Final Folder (Koi duplicate nahi) ==="
          ls -la www/${{ matrix.variant.name }}

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Firebase Gradle Plugin (Auto-Fix)
        run: |
          python3 -c '
          import os
          
          root_gradle = "android/build.gradle"
          if os.path.exists(root_gradle):
              with open(root_gradle, "r") as f: content = f.read()
              if "com.google.gms:google-services" not in content:
                  content = content.replace("dependencies {", "dependencies {\n        classpath \"com.google.gms:google-services:4.4.1\"")
                  with open(root_gradle, "w") as f: f.write(content)
          
          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_gradle):
              with open(app_gradle, "a") as f:
                  f.write("\napply plugin: \"com.google.gms.google-services\"\n")
          print("✅ Firebase injected into Gradle!")
          '

      - name: Generate App Icon
        run: |
          npm install @capacitor/assets --no-save
          mkdir -p resources
          
          if [ -f "assets/${{ matrix.variant.name }}.png" ]; then
            cp "assets/${{ matrix.variant.name }}.png" resources/icon-only.png
            cp "assets/${{ matrix.variant.name }}.png" resources/icon-foreground.png
            cp "assets/${{ matrix.variant.name }}.png" resources/icon.png
          elif [ -f "assets/${{ matrix.variant.name }}.jpg" ]; then
            cp "assets/${{ matrix.variant.name }}.jpg" resources/icon-only.png
            cp "assets/${{ matrix.variant.name }}.jpg" resources/icon-foreground.png
            cp "assets/${{ matrix.variant.name }}.jpg" resources/icon.png
          fi
          
          if [ -d "resources" ]; then
            npx @capacitor/assets generate --android --assetPath resources
          else
            echo "⚠️ Warning: Icon file nahi mili."
          fi

      - name: Fix gradlew
        run: |
          python3 -c "
          content = open('android/gradlew', 'rb').read()
          fixed = content.replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          open('android/gradlew', 'wb').write(fixed)
          "
          chmod +x android/gradlew

      - name: Set Gradle Properties
        run: |
          cat > android/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Generate Google Services JSON
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES" > android/app/google-services.json

      - name: Build ${{ matrix.variant.name }} APK
        timeout-minutes: 25
        working-directory: android
        run: |
          bash gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace

          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" ../${{ matrix.variant.output }}

      - name: Upload ${{ matrix.variant.name }} APK
        uses: actions/upload-artifact@v4
        with:
          name: BattlePro-${{ matrix.variant.name }}-APK
          path: ${{ matrix.variant.output }}
          retention-days: 7
